name: Build

on:
    push:
        branches:
            - main
        # Release tags: scripts/release-download.sh fetches this run's binaries.
        tags:
            - "v*"
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    lint:
        permissions:
            contents: read
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true
            - name: Install golangci-lint
              run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.13.2
            - name: Run linting and tests
              run: scripts/linting.sh

    # The token store, lock and browser code differ per OS, and the Keychain
    # and DPAPI backends only run on their own OS.
    test:
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        env:
            AGW_TEST_NATIVE_STORE: "1"
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true
            - name: Unit tests
              shell: bash
              run: go test ./...
            - name: Integration tests
              shell: bash
              run: go test -tags integration ./test/...

    build:
        permissions:
            contents: read
            # Tag builds of a public repository get a build provenance attestation;
            # scripts/release-download.sh checks it before signing.
            id-token: write
            attestations: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Linux and Windows need no cgo and cross-compile.
                    - { runner: ubuntu-26.04, goos: linux, goarch: amd64 }
                    - { runner: ubuntu-26.04, goos: linux, goarch: arm64 }
                    - { runner: ubuntu-26.04, goos: windows, goarch: amd64 }
                    - { runner: ubuntu-26.04, goos: windows, goarch: arm64 }
                    # macOS needs cgo for the Keychain, so build on macOS.
                    - { runner: macos-latest, goos: darwin, goarch: amd64 }
                    - { runner: macos-latest, goos: darwin, goarch: arm64 }
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true
            # scripts/build.sh sets the toolchain, cgo and flags, and names the version
            # after the tag (without its v) or the commit.
            - name: Build
              shell: bash
              env:
                  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
              run: scripts/build.sh ${{ matrix.goos }} ${{ matrix.goarch }}
            # Attestations on a private repository need a paid GitHub plan.
            - name: Attest
              if: github.ref_type == 'tag' && github.event.repository.visibility == 'public'
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: build/agw-token-*
            - name: Upload
              uses: actions/upload-artifact@v4
              with:
                  name: agw-token-${{ matrix.goos }}-${{ matrix.goarch }}
                  path: build/

    # Windows Installer packages from the CI binaries, to catch packaging errors on every
    # change. Releases build theirs in scripts/release-sign.sh from the signed binaries.
    msi:
        needs: build
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                goarch: [amd64, arm64]
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Install msitools
              run: sudo apt-get update && sudo apt-get install -y msitools wixl
            - name: Download binaries
              uses: actions/download-artifact@v4
              with:
                  name: agw-token-windows-${{ matrix.goarch }}
                  path: binaries
            - name: Build MSI
              shell: bash
              env:
                  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
              run: |
                  stage="$RUNNER_TEMP/stage"
                  mkdir -p "$stage"
                  for variant in "" -google -entra; do
                      cp "binaries/agw-token$variant-windows-${{ matrix.goarch }}.exe" "$stage/agw-token$variant.exe"
                  done
                  cp LICENSE README.md "$stage/"
                  scripts/build-msi.sh windows-${{ matrix.goarch }} "$VERSION" "$stage" msi/agw-token-windows-${{ matrix.goarch }}.msi
            - name: Upload
              uses: actions/upload-artifact@v4
              with:
                  name: agw-token-msi-windows-${{ matrix.goarch }}
                  path: msi/

    # Installs the amd64 package, runs agw-token from the install directory, then
    # uninstalls it and checks that the files and the PATH entry are gone.
    msi-install:
        needs: msi
        permissions:
            contents: read
        runs-on: windows-latest
        steps:
            - name: Download MSI
              uses: actions/download-artifact@v4
              with:
                  name: agw-token-msi-windows-amd64
                  path: msi
            - name: Install, run and uninstall
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $msi = (Resolve-Path msi\agw-token-windows-amd64.msi).Path
                  $dir = 'C:\Program Files\Agent Gateway helper'
                  function Invoke-Msiexec([string[]]$arguments) {
                      $p = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
                      if ($p.ExitCode -ne 0) {
                          Get-Content "$env:RUNNER_TEMP\msi.log" -ErrorAction SilentlyContinue | Select-Object -Last 50
                          throw "msiexec $arguments exited with $($p.ExitCode)"
                      }
                  }
                  function Get-MachinePath {
                      [Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';'
                  }

                  Invoke-Msiexec @('/i', "`"$msi`"", '/qn', '/l*v', "`"$env:RUNNER_TEMP\msi.log`"")
                  foreach ($exe in 'agw-token.exe', 'agw-token-google.exe', 'agw-token-entra.exe') {
                      if (-not (Test-Path "$dir\$exe")) { throw "$exe not installed" }
                  }
                  if ((Get-MachinePath) -notcontains "$dir\") { throw "$dir not on the machine PATH: $(Get-MachinePath)" }
                  # A new session picks up the machine PATH; this one still has the old one.
                  $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine')
                  $found = (Get-Command agw-token).Source
                  if ($found -ne "$dir\agw-token.exe") { throw "agw-token resolves to $found" }
                  agw-token version
                  $v = agw-token-google version
                  if ($v -notmatch 'default provider google') { throw "agw-token-google version printed: $v" }

                  Invoke-Msiexec @('/x', "`"$msi`"", '/qn', '/l*v', "`"$env:RUNNER_TEMP\msi.log`"")
                  if (Test-Path $dir) { throw "$dir still exists after uninstall" }
                  if ((Get-MachinePath) | Where-Object { $_ -like '*Agent Gateway helper*' }) {
                      throw "PATH entry left after uninstall: $(Get-MachinePath)"
                  }

    # Builds Linux and Windows twice, from different directories with empty build
    # caches, and fails if any binary differs: the release sums depend on it.
    reproducible:
        permissions:
            contents: read
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: false
            - name: Build twice and compare
              shell: bash
              run: |
                  second="$RUNNER_TEMP/second"
                  git worktree add --detach "$second" HEAD
                  for target in "linux amd64" "linux arm64" "windows amd64" "windows arm64"; do
                      GOCACHE="$RUNNER_TEMP/cache1" VERSION=1.0.0 scripts/build.sh $target
                      (cd "$second" && GOCACHE="$RUNNER_TEMP/cache2" VERSION=1.0.0 scripts/build.sh $target)
                  done
                  (cd build && sha256sum agw-token-*) > "$RUNNER_TEMP/first.sums"
                  (cd "$second/build" && sha256sum agw-token-*) > "$RUNNER_TEMP/second.sums"
                  cat "$RUNNER_TEMP/first.sums"
                  diff "$RUNNER_TEMP/first.sums" "$RUNNER_TEMP/second.sums"
