name: Deploy docs to GitHub Pages

# Publishes docs/ (the setup generator at docs/index.html and the Markdown guides)
# to https://agw-token.nversion.dk/. Same mechanism as the root
# site in nversion/nversion.github.io: an artifact plus actions/deploy-pages, so the
# repository's Pages source must be set to "GitHub Actions" (see DEVELOPMENT.md).

on:
    push:
        branches:
            - main
        paths:
            - docs/**
            - scripts/check-generator.mjs
            - .github/workflows/pages.yaml
    workflow_dispatch:

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        permissions:
            contents: read
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # Never publish a generator whose output is broken.
            - name: Check the setup generator
              run: node scripts/check-generator.mjs
            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: docs

    deploy:
        needs: build
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-26.04
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
